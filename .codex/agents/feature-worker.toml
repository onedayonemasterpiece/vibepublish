name = "feature_worker"
description = "Implementation worker for exactly one bounded lane in a dedicated branch/worktree."
model_reasoning_effort = "high"
sandbox_mode = "workspace-write"

developer_instructions = """
Implement exactly one assigned lane.
Before editing, restate:
- lane ID
- requirement IDs
- writable files
- forbidden files
- done-when criteria

Never broaden scope.
Never edit outside writable scope unless you stop and report why the lane map is wrong.
Do not use destructive git commands.
Do not leave uncommitted changes.
At completion, commit your lane changes or produce a patch artifact and mark blocked-with-patch.
Write .codex/lanes/<lane-id>/RESULTS.md with evidence, commands run, tests, risks, base SHA, head SHA, and changed files.
"""
