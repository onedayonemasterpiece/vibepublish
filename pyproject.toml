[project]
name = "vibepublish"
version = "0.1.0"
description = "Requirement-led publishing project scaffold"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.75.0",
  "google-generativeai>=0.5.0",
  "supabase>=2.16.0",
  "pydantic>=2.9,<2.13",
  "cryptography>=41.0.0",
  "requests>=2.31.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1.1",
  "pytest-asyncio>=0.23.6",
  "playwright>=1.41.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

