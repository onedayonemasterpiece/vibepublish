[build-system]
requires = ["setuptools>=80,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "vibepublish"
version = "0.1.0"
description = "Native-only social command ledger and MCP service"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.optional-dependencies]
telegram = ["Telethon==1.44.0"]
vk = ["aiohttp==3.13.3"]
legacy-google = ["google-genai>=1.75.0", "google-generativeai>=0.5.0",
                 "supabase>=2.16.0", "requests>=2.31.0", "PyYAML>=6.0"]

[project.scripts]
vibepublish = "social_operations.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.in"]}

[tool.setuptools.packages.find]
include = ["social_operations*", "adapters*", "contracts*", "google_ai*"]

[tool.setuptools.package-data]
social_operations = ["schema.sql", "visual_schema.sql", "emoji_schema.sql", "resolution_schema.sql", "recovery_schema.sql", "media_store_schema.sql", "telegram_media_budget_schema.sql", "workspace_upload_schema.sql", "vk_story_dependencies.sql", "media_service_topic_schema.sql", "media_entry_grant_schema.sql", "carousel_schema.sql", "carousel_editorial_schema.sql", "fonts/*.ttf", "fonts/OFL-*.txt"]

[tool.setuptools.data-files]
"share/vibepublish" = ["docs/llm/vibepublish-social-skill.md"]
"share/vibepublish/carousel" = ["docs/llm/carousel/README.md", "docs/llm/carousel/00-process.md", "docs/llm/carousel/10-storytelling.md", "docs/llm/carousel/20-composition.md", "docs/llm/carousel/30-seams.md", "docs/llm/carousel/40-typography.md", "docs/llm/carousel/50-palettes.md", "docs/llm/carousel/60-generation.md", "docs/llm/carousel/70-montage.md", "docs/llm/carousel/80-variation.md", "docs/llm/carousel/85-style-continuity.md", "docs/llm/carousel/90-review.md", "docs/llm/carousel/95-infographics.md", "docs/llm/carousel/99-platform.md"]
"share/vibepublish/carousel/img" = ["docs/llm/carousel/img/transition-atlas.svg", "docs/llm/carousel/img/palette-catalog.svg", "docs/llm/carousel/img/variation-study.svg"]

"share/vibepublish/carousel/steps" = ["docs/llm/carousel/steps/s01.md", "docs/llm/carousel/steps/s02.md", "docs/llm/carousel/steps/s03.md", "docs/llm/carousel/steps/s04.md", "docs/llm/carousel/steps/s05.md", "docs/llm/carousel/steps/s06.md", "docs/llm/carousel/steps/s07.md", "docs/llm/carousel/steps/s08.md", "docs/llm/carousel/steps/s09.md", "docs/llm/carousel/steps/s10.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
