<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1470" viewBox="0 0 1320 1470" role="img" aria-labelledby="title desc">
<title id="title">Атлас переходов Story Carousel</title>
<desc id="desc">Шесть авторских схем: панорама, объект-мост, общая панель, нить, совпадение кадра и приближение детали. Пунктир показывает будущие границы карточек; значимый текст остаётся внутри карточки.</desc>
<defs>
 <pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="4" cy="7" r="1" fill="#65756c" opacity=".14"/></pattern>
</defs>
<rect width="1320" height="1470" fill="#f3f0e8"/>
<g font-family="DejaVu Sans,Arial,sans-serif" fill="#172a2b">
<text x="42" y="53" font-size="32" font-weight="700">Один холст. Шесть способов продолжить историю.</text>
<text x="42" y="86" font-size="18">Авторские схемы переходов · пунктир = граница карточки · каждая карточка читается отдельно</text>
<g transform="translate(30,112)"><rect width="630" height="407" rx="18" fill="#fffdf8" stroke="#d6d8ce"/>
