 <text x="40" y="165" font-size="19" fill="#fffdf8" font-weight="700">Что было</text><text x="218" y="165" font-size="19" fill="#fffdf8" font-weight="700">Что видим</text><text x="411" y="165" font-size="19" fill="#fffdf8" font-weight="700">Что дальше</text><text x="40" y="193" font-size="14" fill="#d7e0d5" font-weight="400">Первый факт</text><text x="218" y="193" font-size="14" fill="#d7e0d5" font-weight="400">Второй факт</text><text x="411" y="193" font-size="14" fill="#d7e0d5" font-weight="400">Один вопрос</text></g>
<path d="M 190 0 V 237.5" stroke="#fffdf8" stroke-width="4"/><path d="M 190 0 V 237.5" stroke="#9e4c36" stroke-width="1.5" stroke-dasharray="5 5"/>
<path d="M 380 0 V 237.5" stroke="#fffdf8" stroke-width="4"/><path d="M 380 0 V 237.5" stroke="#9e4c36" stroke-width="1.5" stroke-dasharray="5 5"/>
