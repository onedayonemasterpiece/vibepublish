<text x="388" y="258" font-size="12" fill="#65756c" font-weight="400">03</text>
</g>
<text x="24" y="376" font-size="14" fill="#51615a" font-weight="400">Лицо, надпись и ключевую деталь помещаем вне линии реза.</text>
</g>
<g transform="translate(30,542)"><rect width="630" height="407" rx="18" fill="#fffdf8" stroke="#d6d8ce"/>
<text x="24" y="37" font-size="22" fill="#172a2b" font-weight="700">03  Общая панель</text>
<text x="24" y="65" font-size="14" fill="#51615a" font-weight="400">Плашка общая; смысловые текстовые ячейки самостоятельны.</text>
<g transform="translate(30,86)">
