<text x="198" y="258" font-size="12" fill="#65756c" font-weight="400">02</text>
<text x="388" y="258" font-size="12" fill="#65756c" font-weight="400">03</text>
</g>
<text x="24" y="376" font-size="14" fill="#51615a" font-weight="400">Скругляем объект до нарезки. Не разрезаем слова и строки.</text>
</g>
<g transform="translate(680,542)"><rect width="630" height="407" rx="18" fill="#fffdf8" stroke="#d6d8ce"/>
<text x="24" y="37" font-size="22" fill="#172a2b" font-weight="700">04  Нить / маршрут</text>
<text x="24" y="65" font-size="14" fill="#51615a" font-weight="400">Линия задаёт направление, порядок и возвращение внимания.</text>
<g transform="translate(30,86)">
