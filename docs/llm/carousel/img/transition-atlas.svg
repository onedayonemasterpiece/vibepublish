<text x="24" y="376" font-size="14" fill="#51615a" font-weight="400">Линия поддерживает ход мысли; она не заменяет сам сюжет.</text>
</g>
<g transform="translate(30,972)"><rect width="630" height="407" rx="18" fill="#fffdf8" stroke="#d6d8ce"/>
