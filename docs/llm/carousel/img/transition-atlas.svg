 <text x="24" y="28" font-size="16" fill="#172a2b" font-weight="700">Тогда</text><text x="214" y="28" font-size="16" fill="#172a2b" font-weight="700">Сейчас</text><text x="404" y="28" font-size="16" fill="#172a2b" font-weight="700">Сопоставление</text></g>
