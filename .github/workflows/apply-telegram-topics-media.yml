name: Apply tested Telegram topics/media patch

on:
  push:
    branches: [work/telegram-topics-media-20260912]
    paths:
      - .delivery/telegram-topics-media-20260912.patch.gz.b64
      - .github/workflows/apply-telegram-topics-media.yml

permissions:
  contents: write

concurrency:
  group: telegram-topics-media-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify bootstrap parent and apply exact tested patch
        shell: bash
        run: |
          set -euo pipefail
          test -f .delivery/telegram-topics-media-20260912.patch.gz.b64
          test "$(git rev-parse HEAD^1)" = "6acaf49c8c4a3dfcb35abd7fdd41b068420bb346"
          base64 -d .delivery/telegram-topics-media-20260912.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/telegram-topics-media.patch"
          patch -p1 --forward --batch < "$RUNNER_TEMP/telegram-topics-media.patch"
          rm -f .delivery/telegram-topics-media-20260912.patch.gz.b64
          rmdir .delivery 2>/dev/null || true
          rm -f .github/workflows/apply-telegram-topics-media.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "telegram: add forum topics and MCP media readback"
          git push origin HEAD:work/telegram-topics-media-20260912
