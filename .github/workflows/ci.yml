name: VibePublish verification
on:
  push:
    branches: [main, work/vibepublish-core-20260904]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  telegram-p0:
    name: Telegram P0 source gate (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install committed dependency graph and application
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Exact source diff hygiene
        run: git diff --check HEAD^ HEAD
      - name: Focused Telegram P0 regressions
        run: |
          python -m pytest \
            tests/providers/test_telegram_resilience.py \
            tests/providers/test_telegram_p0.py \
            tests/providers/test_telegram_topics.py \
            tests/runtime/test_https_ingress.py \
            tests/runtime/test_telegram_topics_runtime.py -q
      - name: Compile and import changed runtime modules
        run: |
          python -m compileall -q adapters/telegram_resilient.py adapters/wiring.py social_operations/ingress.py social_operations/server.py
          python -c "import adapters.telegram_resilient, adapters.wiring, social_operations.ingress, social_operations.server"

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install committed dependency lock in an empty environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/verification/wheels
          python -m venv "$RUNNER_TEMP/vp-resolve"
          PY="$RUNNER_TEMP/vp-resolve/bin/python"
          "$PY" -m pip install --disable-pip-version-check -r requirements.lock
          "$PY" -m pip check
          cp requirements.lock artifacts/verification/resolved.lock
          "$PY" scripts/verify/dependencies.py requirements.lock --inputs requirements.verification.in > artifacts/verification/inputs.json
          "$PY" scripts/verify/dependencies.py artifacts/verification/resolved.lock > artifacts/verification/resolved-environment.json
          echo "VERIFY_PYTHON=$PY" >> "$GITHUB_ENV"
      - name: Canonical contract regression
        run: |
          "$VERIFY_PYTHON" tests/contracts/test_social_mcp_design.py
          "$VERIFY_PYTHON" tests/contracts/test_forwarding_profiles_design.py
      - name: Passive inventory and verification-tool regression
        run: '"$VERIFY_PYTHON" -m pytest tests/inspection tests/verification -q --junitxml=artifacts/verification/tool-tests.xml'
      - name: Real Telegram SDK wire roundtrip - not core or live evidence
        run: '"$VERIFY_PYTHON" scripts/verify/telegram_wire.py > artifacts/verification/telegram-sdk.json'
      - name: Build a hashed dependency wheelhouse
        run: |
          "$VERIFY_PYTHON" -m pip wheel --no-deps -r artifacts/verification/resolved.lock -w artifacts/verification/wheels
          "$VERIFY_PYTHON" scripts/verify/dependencies.py artifacts/verification/resolved.lock --wheelhouse artifacts/verification/wheels > artifacts/verification/wheelhouse.lock
      - name: Reinstall locked graph offline into a second empty environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/vp-locked"
          PY="$RUNNER_TEMP/vp-locked/bin/python"
          "$PY" -m pip install --no-index --only-binary=:all: --require-hashes --find-links artifacts/verification/wheels -r artifacts/verification/wheelhouse.lock
          "$PY" -m pip check
          "$PY" scripts/verify/dependencies.py artifacts/verification/resolved.lock > artifacts/verification/locked-environment.json
          "$PY" scripts/verify/telegram_wire.py > artifacts/verification/telegram-sdk-locked.json
      - name: Install full application and browser prerequisites
        run: |
          "$VERIFY_PYTHON" -m pip install --no-deps --no-build-isolation -e .
          "$VERIFY_PYTHON" -m pip check
          "$VERIFY_PYTHON" -m playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends libcairo2 fonts-dejavu-core ffmpeg
      - name: Real SDK and complete runtime regression - mandatory
        run: |
          "$VERIFY_PYTHON" scripts/verify/telegram_sdk.py > artifacts/verification/core-sdk.json
          "$VERIFY_PYTHON" -m pytest tests -q --junitxml=artifacts/verification/full-tests.xml
      - name: Compile delivered implementation
        run: '"$VERIFY_PYTHON" -m compileall -q social_operations adapters scripts/verify'
      - name: Source and environment receipt
        if: always()
        run: |
          mkdir -p artifacts/verification
          git archive --format=tar HEAD > artifacts/verification/source.tar
          git rev-parse HEAD > artifacts/verification/source-sha.txt
          python --version > artifacts/verification/python.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.python }}-${{ github.sha }}
          path: artifacts/verification/
          retention-days: 7

  core-recovery:
    name: Core recovery (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the same committed dependency graph and actual application
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Offline rendering prerequisites used by runtime fixtures
        run: sudo apt-get install -y --no-install-recommends libcairo2 fonts-dejavu-core ffmpeg
      - name: Original recovery, authenticated MCP workers and provider compatibility
        run: |
          mkdir -p artifacts/core-recovery
          python scripts/verify/telegram_sdk.py > artifacts/core-recovery/core-sdk.json
          python -m pytest tests/runtime tests/contracts tests/providers tests/sdk -q --junitxml=artifacts/core-recovery/tests.xml
          python -m compileall -q social_operations adapters
      - name: Exact source receipt
        if: always()
        run: |
          mkdir -p artifacts/core-recovery
          git rev-parse HEAD > artifacts/core-recovery/source-sha.txt
          python --version > artifacts/core-recovery/python.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-recovery-${{ matrix.python }}-${{ github.sha }}
          path: artifacts/core-recovery/
          retention-days: 7
