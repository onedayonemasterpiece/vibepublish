name: VibePublish verification
on:
  push:
    branches: [main, work/vibepublish-core-20260904]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract dependencies
        run: python -m pip install -r contracts/requirements.txt
      - name: Canonical contract regression
        run: |
          python tests/contracts/test_social_mcp_design.py
          python tests/contracts/test_forwarding_profiles_design.py
      - name: Reproducible source snapshot
        if: always()
        run: |
          mkdir -p artifacts/verification
          git archive --format=tar HEAD > artifacts/verification/source.tar
          git rev-parse HEAD > artifacts/verification/source-sha.txt
          python -m pip freeze > artifacts/verification/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ github.sha }}
          path: artifacts/verification/
          retention-days: 7
