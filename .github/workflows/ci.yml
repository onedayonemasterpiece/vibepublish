name: VibePublish verification
on:
  push:
    branches: [main, work/vibepublish-core-20260904, work/vibepublish-max-web-20260904]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          if [ -f requirements.in ]; then
            python -m pip install -r requirements.in
          else
            python -m pip install -r contracts/requirements.txt
          fi
          python -m pip install -r adapters/max/requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Canonical contract regression
        run: |
          python tests/contracts/test_social_mcp_design.py
          python tests/contracts/test_forwarding_profiles_design.py
      - name: MAX fixture safety and observed navigation/recovery/writer qualification
        run: |
          test -s tests/browser/max/observed/replay.html
          test -s tests/browser/max/observed/manifest.json
          test -s tests/browser/max/observed/test_live_navigation.py
          test -s tests/browser/max/observed/test_submit.py
          python -m pytest tests/adapters/max tests/browser/max -q -ra
      - name: Passive imagegen inventory regression
        if: ${{ hashFiles('tests/inspection/test_imagegen_inventory.py') != '' }}
        run: python -m pytest tests/inspection -q
      - name: Compile implementation
        run: |
          python -m compileall -q adapters
          if [ -d social_operations ]; then python -m compileall -q social_operations; fi
      - name: Reproducible source and SDK fixture
        if: always()
        run: |
          mkdir -p artifacts/verification/wheels
          git archive --format=tar HEAD > artifacts/verification/source.tar
          git rev-parse HEAD > artifacts/verification/source-sha.txt
          python -m pip freeze > artifacts/verification/environment.txt
          python -m pip download --no-deps mcp==1.29.0 sse-starlette httpx-sse -d artifacts/verification/wheels
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ github.sha }}
          path: artifacts/verification/
          retention-days: 7
  max-actual-core:
    name: MAX with pinned actual core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: max
      - uses: actions/checkout@v4
        with:
          # Existing PR #1, actual ProviderAdapter/worker, never a vendored port.
          ref: 6df84604a51089eb631357c7230b4f38a1da76c4
          path: core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble scoped MAX delta on exact core
        run: |
          test "$(git -C core rev-parse HEAD)" = 6df84604a51089eb631357c7230b4f38a1da76c4
          cp -a max/adapters/max core/adapters/max
          mkdir -p core/tests/browser core/tests/adapters
          cp -a max/tests/browser/max core/tests/browser/max
          cp -a max/tests/adapters/max core/tests/adapters/max
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r core/requirements.in
          python -m pip install -r max/adapters/max/requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Actual MCP worker and native bridge regressions (no missing-core skips)
        working-directory: core
        env:
          VIBEPUBLISH_MAX_CORE_REQUIRED: '1'
        run: python -m pytest tests/browser/max/core -q -ra --asyncio-mode=auto
